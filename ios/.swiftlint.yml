included:
  - App
  - Core
  - Feature
  - Services

excluded:
  - "**/.build"
  - "**/DerivedData"
  - "**/Derived"

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 40
  error: 80

function_parameter_count:
  warning: 5
  error: 8

type_body_length:
  warning: 250
  error: 400

file_length:
  warning: 500
  error: 800

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y

type_name:
  min_length:
    warning: 3
  max_length:
    warning: 50
    error: 60

force_cast: warning
force_try: warning
trailing_whitespace: warning
redundant_string_enum_value: warning
unused_closure_parameter: warning

opt_in_rules:
  - empty_count
  - sorted_imports
  - vertical_whitespace_between_cases
  - collection_alignment
  - prefer_self_in_static_references
  - explicit_init
  - closure_end_indentation

analyzer_rules:
  - unused_declaration
